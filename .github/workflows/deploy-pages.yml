name: Deploy to GitHub Pages

# CI already builds the Windows/macOS/Linux installers, so Pages waits for it and
# reuses those artifacts instead of rebuilding Tauri here.
on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (including submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          submodules: recursive
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive 'git lfs pull'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Download installer packages from CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          pattern: installer-packages-*
          merge-multiple: true
          path: public/downloads
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # sync:downloads regenerates manifest.json from everything staged in public/downloads,
      # so the per-OS artifacts are merged into a single download list.
      - name: Sync generated assets and downloads
        run: |
          npm run sync:logo
          npm run sync:markdown-design
          npm run sync:downloads

      - name: Build site
        env:
          GITHUB_PAGES: 'true'
        run: npm run build:site

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
