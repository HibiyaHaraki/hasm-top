name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build and Smoke Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive 'git lfs pull'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Upload installer packages
        uses: actions/upload-artifact@v4
        with:
          name: installer-packages-${{ runner.os }}
          path: |
            public/downloads/manifest.json
            public/downloads/**/*.msi
            public/downloads/**/*.exe
            public/downloads/**/*.dmg
            public/downloads/**/*.AppImage
            public/downloads/**/*.deb
            public/downloads/**/*.zip
          if-no-files-found: error

      - name: Serve and smoke-test site
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          npm run check:site -- http://127.0.0.1:4173/